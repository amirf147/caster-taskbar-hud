name: CI & Safety Hygiene

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  safety-and-hygiene:
    name: Security, Path Hygiene & Mod Metadata
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Repository Safety & Mod Metadata Checker
        run: python scripts/check_repo_safety.py

      - name: Verify Test Harness CLI
        run: python scripts/test_taskbar_hud_stream.py --help
